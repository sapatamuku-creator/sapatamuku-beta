<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SapaTamu.Ku - Classic Unit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #1a1a1a; 
            --theme-accent: #b49164;
            --theme-bg: #ffffff;
            --theme-bg-alt: #fcfaf8;
            --font-main: 'Montserrat', sans-serif;
        }
        body { font-family: var(--font-main); background: var(--theme-bg); color: var(--primary); margin:0; padding:0; overflow-x: hidden; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 1s ease-out; }
        .reveal.active { opacity: 1; transform: translate(0); }
        .circle-frame { width: 280px; height: 280px; border-radius: 50%; border: 1px solid var(--theme-accent); padding: 10px; margin: 0 auto; }
        .circle-frame img { width: 100%; height: 100%; border-radius: 50%; object-cover: cover; }
    </style>
</head>
<body>
    <div id="loader" class="fixed inset-0 bg-white z-[999] flex items-center justify-center text-stone-400">Loading Classic Unit...</div>
    <div id="main-content"></div>

    <script>
        const _supabase = supabase.createClient('https://cikptujrdfvxyfihwamh.supabase.co', 'sb_publishable_seQaFKa8TwHg7fVTK0GHIg_T0wT93_B');
        
        async function loadUnit() {
            const urlParams = new URLSearchParams(window.location.search);
            const clientId = urlParams.get('clientId');
            if(!clientId) return;

            const { data: c } = await _supabase.from('invitations').select('*').ilike('client_id', clientId).maybeSingle();
            if(c) renderClassic(c);
            document.getElementById('loader').classList.add('hidden');
        }

        function renderClassic(data) {
            const c = data.theme_config || data.config || data;
            const container = document.getElementById('main-content');
            
            let storyHtml = "";
            if(Array.isArray(c.story)) {
                c.story.forEach((s, idx) => {
                    const isEven = idx % 2 === 0;
                    storyHtml += `
                        <div class="mb-16 reveal">
                            <div class="flex flex-col items-center">
                                <span class="text-[10px] text-stone-400 font-bold uppercase tracking-[0.3em] mb-4">${s.date}</span>
                                <h3 class="text-2xl font-serif text-stone-800 mb-6">${s.title}</h3>
                                <p class="text-sm text-stone-500 leading-loose max-w-lg mx-auto italic">${s.desc}</p>
                                <div class="w-px h-12 bg-stone-200 mt-8"></div>
                            </div>
                        </div>
                    `;
                });
            }

            let bankHtml = "";
            if(Array.isArray(c.banking)) {
                c.banking.forEach(b => {
                    bankHtml += `
                        <div class="p-10 border border-stone-100 rounded-2xl reveal hover:shadow-xl transition-shadow duration-500">
                            <p class="text-[9px] font-bold text-stone-300 uppercase tracking-[0.4em] mb-6">${b.bank}</p>
                            <p class="text-2xl font-serif text-stone-700 mb-2">${b.no}</p>
                            <p class="text-[10px] text-stone-400 uppercase tracking-widest">a/n ${b.name}</p>
                        </div>
                    `;
                });
            }

            container.innerHTML = `
                <section class="min-h-screen flex flex-col items-center justify-center text-center p-10 bg-stone-50">
                    <p class="text-[10px] tracking-[0.4em] mb-10 text-stone-400 reveal uppercase">The Wedding Invitation</p>
                    <div class="circle-frame mb-10 reveal">
                        <img src="${c.bg_image || 'https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=800'}">
                    </div>
                    <h1 class="text-5xl font-serif mb-6 reveal">${c.pria_short} & ${c.wanita_short}</h1>
                    <p class="text-sm tracking-widest text-stone-500 reveal">${c.event_date || ''}</p>
                    <div class="mt-12 reveal">
                        <button class="px-8 py-3 bg-stone-800 text-white text-[10px] font-bold uppercase tracking-widest rounded-full">Buka Undangan</button>
                    </div>
                </section>

                <section class="py-24 px-6 bg-white border-y border-stone-50">
                    <div class="max-w-3xl mx-auto">
                        <div class="text-center mb-20">
                            <h2 class="text-3xl font-serif text-stone-800 mb-2">Cerita Kita</h2>
                            <div class="w-10 h-[1px] bg-stone-300 mx-auto mt-6"></div>
                        </div>
                        ${storyHtml}
                    </div>
                </section>

                <section class="py-24 px-6 bg-[#fcfaf8]">
                    <div class="max-w-4xl mx-auto text-center">
                        <div class="mb-16">
                            <h2 class="text-3xl font-serif text-stone-800 mb-4">Kado Digital</h2>
                            <p class="text-xs text-stone-400 uppercase tracking-[0.2em]">Wedding Gift</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                            ${bankHtml}
                        </div>
                    </div>
                </section>
            `;
            initObserver();
        }

        function initObserver() {
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
        }

        loadUnit();
    </script>
</body>
</html>
