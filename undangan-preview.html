<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Digital Invitation - SapaTamu.Ku</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Montserrat:wght@200;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #1a1a1a; --bg: #ffffff; --gold: #D4AF37; }
        body { font-family: 'Montserrat', sans-serif; background: #ffffff; color: #1a1a1a; overflow-x: hidden; scroll-behavior: smooth; }
        .font-serif { font-family: 'Alice', serif; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 1s cubic-bezier(0.2, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translate(0); }
        
        /* Animasi Cover */
        #cover { transition: transform 1s ease-in-out; }
        
        .btn-primary {
            background: #1a1a1a; color: white; border-radius: 9999px;
            font-size: 10px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.25em; padding: 18px 50px; transition: all 0.3s ease;
        }

        .countdown-item { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
        .countdown-val { font-size: 2.2rem; font-family: 'Alice', serif; color: var(--gold); font-weight: bold; }
        
        .gift-card { background: white; border-radius: 24px; padding: 24px; border: 1px solid #f0f0f0; }
        
        .music-bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
        .bar { width: 2px; background: var(--gold); animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { height: 20%; } to { height: 100%; } }
        .paused .bar { animation-play-state: paused; height: 2px; }
    </style>
    <!-- THEME ASSETS PLACEHOLDER -->
    <link id="theme-css" rel="stylesheet" href="">
    <script id="theme-js" defer src=""></script>

    <script>
        // DYNAMIC THEME LOADER
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const theme = urlParams.get('theme') || 'classic-minimalist';
            
            // Set CSS & JS Path
            const cssPath = `assets/themes/${theme}/style.css`;
            const jsPath = `assets/themes/${theme}/script.js`;
            
            document.getElementById('theme-css').href = cssPath;
            document.getElementById('theme-js').src = jsPath;
            
            console.log("Loading Theme Assets:", theme);
        })();
    </script>
</head>

    <script>
        const SUPABASE_URL = "https://cikptujrdfvxyfihwamh.supabase.co";

            // Priority 1: Universal Link Parameter (sapatamu.id/undangan.html?u=username)
            if (urlParams.get('u')) return urlParams.get('u');
            if (urlParams.get('c')) return urlParams.get('c');
            
            // Priority 2: Direct ClientId Parameter (for Editor/Dev)
            if (urlParams.get('clientId')) return urlParams.get('clientId');

            // Priority 3: Subdomain (client.sapatamu.id)
            const parts = host.split('.');
            if (parts.length > 2 && parts[0] !== 'beta' && parts[0] !== 'www') {
                return parts[0];
            }
            return null;
        }

        // --- SECTION LIBRARY (MODULAR BLOCKS WITH THEME VARIANTS) ---

                                    <p class="text-[9px] tracking-[0.2em] theme-text-muted uppercase mb-4 italic">Kepada Yth.</p>
                                    <h2 class="text-3xl font-serif theme-text-main guest-name-placeholder mb-2">Tamu Undangan</h2>

                // Default Cover

                    <div id="cover" class="fixed inset-0 z-[120] flex items-center justify-center text-center theme-bg">

            'quote': (c) => `
                <section class="py-24 px-8 text-center theme-bg-alt">
                    <div class="reveal max-w-2xl mx-auto italic theme-text-dark font-serif opacity-80 leading-relaxed">

            'mempelai': (c, theme) => {
                const isForest = theme === 'forest';
                const frameClass = isForest ? "rounded-t-full rounded-b-lg border-2 border-theme-accent p-1 aspect-[4/5] h-64" : "rounded-full border-4 border-theme-accent p-2 w-48 h-48";

                return `
                    <section class="px-8 py-32 space-y-32 text-center theme-bg overflow-hidden">

                            <a href="${c.groom?.ig || '#'}" target="_blank" class="text-[9px] font-bold tracking-widest theme-text-accent border theme-border-accent px-6 py-2 rounded-full hover:bg-theme-accent hover:text-white transition">INSTAGRAM</a>

                            <h4 class="font-serif italic text-3xl mb-12 theme-text-accent">the Bride</h4>

                                <img src="${c.bride?.photo || ''}" class="w-full h-full object-cover ${imgClass}">
                                ${isForest ? '<div class="absolute -top-4 -left-4 w-12 h-12 theme-text-accent opacity-20"><i class="fas fa-leaf text-4xl -rotate-12"></i></div>' : ''}
                            </div>
                            <h4 class="font-serif italic text-4xl mb-2 theme-text-main">${c.bride?.full_name || 'Nama Wanita'}</h4>
                            <p class="text-[10px] font-bold uppercase tracking-[0.2em] theme-text-accent mb-4">Putri ${c.bride?.sibling || 'Pertama'}</p>
                            <p class="text-[11px] theme-text-muted leading-relaxed mb-6 italic">Bp. ${c.bride?.father || 'A'} & Ibu ${c.bride?.mother || 'B'}</p>
                            <a href="${c.bride?.ig || '#'}" target="_blank" class="text-[9px] font-bold tracking-widest theme-text-accent border theme-border-accent px-6 py-2 rounded-full hover:bg-theme-accent hover:text-white transition">INSTAGRAM</a>
                        </div>
                    </section>
                `;
            },
            'story': (c) => `
                <section class="py-24 px-8 theme-bg-alt">
                    <h3 class="text-3xl font-serif italic text-center mb-16 theme-text-dark">Our Love Story</h3>
                    <div class="max-w-md mx-auto space-y-8">
                        ${(Array.isArray(c.story) ? c.story : [
                            { date: 'First Meet', desc: 'Pertama kali kami bertemu...' },
                            { date: 'Relationship', desc: 'Memutuskan untuk memulai perjalanan bersama...' },
                            { date: 'Engagement', desc: 'Mengikat janji suci di depan keluarga...' }
                        ]).map(s => `
                            <div class="reveal theme-card p-6 rounded-2xl shadow-sm border theme-border relative overflow-hidden">
                                <div class="absolute top-0 left-0 w-1 h-full bg-theme-accent"></div>
                                <h4 class="font-bold text-xs uppercase tracking-widest theme-text-accent mb-2">${s.date}</h4>
                                <p class="text-xs leading-relaxed theme-text-dark opacity-80">${s.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `,
            'acara': (c, theme) => {
                const isForest = theme === 'forest';
                return `
                    <section class="py-24 px-8 theme-bg-alt text-center">
                        <div class="max-w-xl mx-auto space-y-16">
                            <h3 class="text-3xl font-serif italic mb-4 theme-text-main">Wedding Events</h3>
                            ${c.ev1 ? `
                            <div class="reveal theme-card p-10 rounded-[40px] shadow-sm border theme-border relative overflow-hidden">
                                ${isForest ? '<div class="absolute top-4 right-4 text-theme-accent opacity-10"><i class="fas fa-ring text-6xl"></i></div>' : ''}
                                <p class="text-[11px] font-bold tracking-[0.4em] mb-4 uppercase theme-text-accent italic">Akad Nikah</p>
                                <div class="w-12 h-[2px] bg-theme-accent mx-auto mb-6"></div>
                                <p class="text-xl font-serif mb-2 theme-text-main">${c.ev1.time || ''}</p>
                                <p class="text-[11px] uppercase tracking-widest theme-text-muted mb-8 leading-loose">${c.ev1.loc || ''}</p>
                                <a href="${c.ev1.maps || '#'}" target="_blank" class="inline-block px-12 py-4 bg-theme-accent text-white rounded-full text-[9px] uppercase tracking-widest font-bold shadow-lg shadow-theme-accent/20">Petunjuk Lokasi</a>
                            </div>` : ''}
                            ${c.ev2 ? `
                            <div class="reveal theme-card p-10 rounded-[40px] shadow-sm border theme-border relative overflow-hidden">
                                ${isForest ? '<div class="absolute top-4 right-4 text-theme-accent opacity-10"><i class="fas fa-glass-cheers text-6xl"></i></div>' : ''}
                                <p class="text-[11px] font-bold tracking-[0.4em] mb-4 uppercase theme-text-accent italic">Resepsi</p>
                                <div class="w-12 h-[2px] bg-theme-accent mx-auto mb-6"></div>
                                <p class="text-xl font-serif mb-2 theme-text-main">${c.ev2.time || ''}</p>
                                <p class="text-[11px] uppercase tracking-widest theme-text-muted mb-8 leading-loose">${c.ev2.loc || ''}</p>
                                <a href="${c.ev2.maps || '#'}" target="_blank" class="inline-block px-12 py-4 bg-theme-accent text-white rounded-full text-[9px] uppercase tracking-widest font-bold shadow-lg shadow-theme-accent/20">Petunjuk Lokasi</a>
                            </div>` : ''}
                        </div>
                    </section>
                `;
            },
            'galeri': (c) => `
                <section class="py-24 px-4 text-center theme-bg">
                    <h3 class="text-3xl font-serif italic mb-12 theme-text-main">Our Moments</h3>
                    <div class="grid grid-cols-2 gap-3 max-w-lg mx-auto p-2">
                        ${(Array.isArray(c.gallery) ? c.gallery : []).map(src => `<div class="reveal overflow-hidden rounded-2xl shadow-md"><img src="${src}" class="w-full aspect-square object-cover hover:scale-110 transition-transform duration-700"></div>`).join('')}
                    </div>
                </section>
            `,
            'kado': (c) => `
                <section class="py-24 px-8 text-center theme-bg-alt">
                    <h3 class="text-3xl font-serif italic mb-12 theme-text-main">Digital Gift</h3>
                    <div class="space-y-8">
                        ${(Array.isArray(c.banking) ? c.banking : []).map(acc => `
                            <div class="reveal max-w-sm mx-auto theme-card shadow-sm p-10 rounded-[40px] border theme-border relative">
                                <div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-theme-accent text-white text-[8px] font-bold px-4 py-1 rounded-full uppercase tracking-widest">Bank ${(acc.type || 'Bank').toUpperCase()}</div>
                                <h4 class="text-3xl font-serif mb-2 theme-text-main tracking-wider">${acc.rekening || '-'}</h4>
                                <p class="text-[11px] uppercase tracking-widest theme-text-muted mb-8">a.n ${acc.owner || '-'}</p>
                                <button onclick="copyToClipboard('${acc.rekening || ''}')" class="text-[9px] font-bold tracking-widest bg-slate-900 text-white px-10 py-4 rounded-full uppercase hover:bg-slate-800 transition">Salin Rekening</button>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `,
            'access_card': (c) => `
                <section class="py-24 px-8 theme-bg-dark text-center">
                    <div class="reveal max-w-sm mx-auto theme-card text-neutral-900 p-10 rounded-[50px] shadow-2xl">
                        <p class="text-[10px] font-bold tracking-[0.4em] uppercase mb-12 opacity-40 italic">Digital Access Card</p>
                        <div class="w-56 h-56 bg-stone-50 mx-auto mb-10 rounded-3xl flex items-center justify-center border border-dashed border-stone-300 p-4">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=SapaTamu" class="w-full h-full qrcode-img">
                        </div>
                        <h4 class="text-2xl font-serif italic mb-2 guest-name-placeholder">Tamu Undangan</h4>
                        <div class="w-12 h-[1px] bg-slate-200 mx-auto mb-4"></div>
                        <p class="text-[10px] uppercase tracking-[0.2em] opacity-50 px-8 leading-relaxed">Harap tunjukkan kode QR ini kepada petugas untuk proses check-in</p>
                    </div>
                </section>
            `
        };

        function renderModularPage(config) {
            const canvas = document.getElementById('main-canvas');
            const theme = currentThemeId; 
            const sectionsOrder = config.sections_order || ['cover', 'mempelai', 'acara', 'galeri', 'access_card', 'kado'];
            
            let html = "";
            sectionsOrder.forEach(secKey => {
                try {
                    if (SectionLibrary[secKey]) {
                        // Pastikan config adalah object
                        const safeConfig = config || {};
                        html += SectionLibrary[secKey](safeConfig, theme);
                    }
                } catch (e) {
                    console.error(`Gagal merender seksi ${secKey}:`, e);
                }
            });
            
            // Tambahkan Footer Global
            html += `<footer class="py-24 text-center bg-white"><p class="text-[8px] font-bold uppercase tracking-[0.8em] text-gold">SapaTamu.Ku</p></footer>`;
            
            canvas.innerHTML = html;
            
            // Update Guest Name di semua placeholder
            const urlParams = new URLSearchParams(window.location.search);
            const guestName = urlParams.get('to') || "Tamu Undangan";
            document.querySelectorAll('.guest-name-placeholder').forEach(el => el.innerText = guestName);
            
            // Update QR Code
            const clientId = getClientId();
            document.querySelectorAll('.qrcode-img').forEach(img => {
                img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(clientId + ' | ' + guestName)}`;
            });

            if (config.event_date) eventDate = new Date(config.event_date).getTime();
            if (config.music_url) audio.src = config.music_url;

            canvas.classList.remove('opacity-0');
            initObserver();
        }

        async function init() {
            const clientId = getClientId();
            if (!clientId) {
                document.getElementById('loader').classList.add('hidden');
                return;
            }

            try {
                const { data, error } = await _supabase
                    .from('invitations')
                    .select('*')
                    .ilike('client_id', clientId)
                    .maybeSingle();

                if (error) console.error("Supabase Error:", error);

                if (data) {
                    const savedThemeId = data.theme_id;
                    const urlParams = new URLSearchParams(window.location.search);
                    const requestedTheme = urlParams.get('theme');

                    if (savedThemeId === requestedTheme || !requestedTheme) {
                        let c = data.theme_config;
                        if (!c || Object.keys(c).length === 0) c = data.config;
                        
                        if (c && Object.keys(c).length > 0) {
                            const config = typeof c === 'string' ? JSON.parse(c) : c;
                            renderModularPage(config);
                        }
                    } else {
                        // Jika tidak ada data tersimpan untuk tema ini, render modular dengan data kosong (Starter Pack)
                        renderModularPage({});
                    }
                } else {
                    renderModularPage({});
                }
            } catch (err) { 
                console.error("Init error:", err); 
                renderModularPage({});
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert("Nomor rekening berhasil disalin!");
        }

        function startInvitation() {
            if (audio.src) {
                audio.play();
                isPlaying = true;
                updateMusicUI();
            }
            document.getElementById('cover').style.transform = 'translateY(-100%)';
            const canvas = document.getElementById('main-canvas');
            canvas.style.display = 'block';
            setTimeout(() => {
                canvas.style.opacity = '1';
                document.getElementById('music-btn').classList.remove('hidden');
                initObserver();
            }, 500);
        }

        function toggleMusic() {
            isPlaying ? audio.pause() : audio.play();
            isPlaying = !isPlaying;
            updateMusicUI();
        }

        function updateMusicUI() {
            const vis = document.getElementById('visualizer');
            isPlaying ? vis.classList.remove('paused') : vis.classList.add('paused');
            document.getElementById('music-txt').innerText = isPlaying ? "PAUSE" : "PLAY";
        }

        function updateCountdown() {
            if (!eventDate) return;
            const now = new Date().getTime();
            const gap = eventDate - now;
            if (gap > 0) {
                if(document.getElementById("days")) document.getElementById("days").innerText = Math.floor(gap / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                if(document.getElementById("hours")) document.getElementById("hours").innerText = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                if(document.getElementById("mins")) document.getElementById("mins").innerText = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                if(document.getElementById("secs")) document.getElementById("secs").innerText = Math.floor((gap % (1000 * 60)) / 1000).toString().padStart(2, '0');
            }
        }

        function initObserver() {
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
        }

        setInterval(updateCountdown, 1000);
        
        // REAL-TIME SYNC FROM EDITOR
        window.addEventListener('message', (event) => {
            if (event.data.action === 'UPDATE_PREVIEW') {
                const c = event.data.config;
                if (!c) return;
                renderModularPage(c);
            }
        });

        init();
    </script>
</body>
</html>
