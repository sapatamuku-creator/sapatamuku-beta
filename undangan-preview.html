<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Digital Invitation - SapaTamu.Ku</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Montserrat:wght@200;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #1a1a1a; --bg: #ffffff; --gold: #D4AF37; }
        body { font-family: 'Montserrat', sans-serif; background: #ffffff; color: #1a1a1a; overflow-x: hidden; scroll-behavior: smooth; }
        .font-serif { font-family: 'Alice', serif; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 1s cubic-bezier(0.2, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translate(0); }
        
        /* Animasi Cover */
        #cover { transition: transform 1s ease-in-out; }
        
        .btn-primary {
            background: #1a1a1a; color: white; border-radius: 9999px;
            font-size: 10px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.25em; padding: 18px 50px; transition: all 0.3s ease;
        }

        .countdown-item { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
        .countdown-val { font-size: 2.2rem; font-family: 'Alice', serif; color: var(--gold); font-weight: bold; }
        
        .gift-card { background: white; border-radius: 24px; padding: 24px; border: 1px solid #f0f0f0; }
        
        .music-bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
        .bar { width: 2px; background: var(--gold); animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { height: 20%; } to { height: 100%; } }
        .paused .bar { animation-play-state: paused; height: 2px; }
    </style>
    <!-- THEME ASSETS PLACEHOLDER -->
    <link id="theme-css" rel="stylesheet" href="">
    <script id="theme-js" defer src=""></script>

    <script>
        // DYNAMIC THEME LOADER
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const theme = urlParams.get('theme') || 'classic-minimalist';
            
            // Set CSS & JS Path
            const cssPath = `assets/themes/${theme}/style.css`;
            const jsPath = `assets/themes/${theme}/script.js`;
            
            document.getElementById('theme-css').href = cssPath;
            document.getElementById('theme-js').src = jsPath;
            
            console.log("Loading Theme Assets:", theme);
        })();
    </script>
</head>
<body class="bg-pattern">

    <!-- LOADING LOADER -->
    <div id="loader" class="fixed inset-0 z-[200] bg-white flex items-center justify-center">
        <div class="text-center">
            <div class="w-12 h-12 border-4 border-stone-100 border-t-rose-400 rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-[10px] font-bold tracking-[0.3em] text-stone-400 uppercase">Memuat Undangan...</p>
        </div>
    </div>

    <!-- DYNAMIC SECTION CONTAINER (CANVAS) -->
    <div id="main-canvas" class="opacity-0 transition-opacity duration-1000">
        <!-- Sections akan di-render secara modular di sini oleh JavaScript -->
    </div>

    <!-- MUSIC PLAYER UI (Global) -->
    <div id="music-btn" class="fixed z-[110] bottom-8 right-8 hidden transition-all duration-500">
        <button onclick="toggleMusic()" class="w-14 h-14 bg-white border shadow-2xl rounded-full flex flex-col items-center justify-center gap-1">
            <div id="visualizer" class="music-bars paused">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <p id="music-txt" class="text-[7px] font-bold uppercase tracking-tighter text-neutral-400">PLAY</p>
        </button>
    </div>
    <audio id="main-audio" loop></audio>

    <script>
        const SUPABASE_URL = "https://cikptujrdfvxyfihwamh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_seQaFKa8TwHg7fVTK0GHIg_T0wT93_B";
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let audio = document.getElementById('main-audio');
        let isPlaying = false;
        let eventDate = null;

        function getClientId() {
            const host = window.location.hostname;
            const urlParams = new URLSearchParams(window.location.search);
            
            // Priority 1: URL Parameter (for editor preview)
            if (urlParams.has('clientId')) return urlParams.get('clientId');
            
            // Priority 2: Subdomain
            const parts = host.split('.');
            if (parts.length >= 3) {
                // Handle: subdomain.beta.sapatamu.id (4 parts) or subdomain.sapatamu.id (3 parts)
                if (parts[parts.length-2] === 'sapatamu') {
                    return parts[0];
                }
            }
            return null;
        }

        const BANK_LOGOS = {
            'bca': 'https://upload.wikimedia.org/wikipedia/commons/5/5c/Bank_Central_Asia.svg',
            'mandiri': 'https://upload.wikimedia.org/wikipedia/commons/a/ad/Bank_Mandiri_logo_2016.svg',
            'bni': 'https://upload.wikimedia.org/wikipedia/commons/0/05/Logo_BNI_46.svg',
            'bri': 'https://upload.wikimedia.org/wikipedia/commons/2/2e/BRI_Logo.svg',
            'dana': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Logo_DANA.svg',
            'ovo': 'https://upload.wikimedia.org/wikipedia/commons/e/eb/Logo_ovo_purple.svg',
            'gopay': 'https://upload.wikimedia.org/wikipedia/commons/8/86/Gopay_logo.svg',
            'shopeepay': 'https://upload.wikimedia.org/wikipedia/commons/a/af/ShopeePay_logo.svg',
            'qris': 'https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_QRIS.svg'
        };

        // --- SECTION LIBRARY (MODULAR BLOCKS) ---
        const SectionLibrary = {
            'cover': (c) => `
                <div id="cover" class="fixed inset-0 z-[120] flex items-center justify-center text-center bg-white">
                    <div class="absolute inset-0"><img src="${c.bg_image || ''}" class="w-full h-full object-cover opacity-30"></div>
                    <div class="relative z-10 px-8">
                        <p class="text-[9px] tracking-[0.5em] uppercase mb-6 text-neutral-400 font-bold">${c.title || 'The Wedding Celebration'}</p>
                        <h1 class="text-5xl font-serif text-neutral-900 mb-12">${c.pria_short || 'Pria'} & ${c.wanita_short || 'Wanita'}</h1>
                        <div class="mb-12">
                            <p class="text-[9px] tracking-[0.2em] text-neutral-400 uppercase mb-3">Yth. Bapak/Ibu/Saudara/i</p>
                            <h2 class="text-2xl font-serif italic text-neutral-800 guest-name-placeholder">Tamu Undangan</h2>
                        </div>
                        <button onclick="startInvitation()" class="btn-primary">Buka Undangan</button>
                    </div>
                </div>
            `,
            'mempelai': (c) => `
                <section class="px-8 py-32 space-y-24 text-center">
                    <div class="reveal">
                        <h4 class="font-serif italic text-3xl mb-6">the Groom</h4>
                        <h4 class="font-serif italic text-3xl mb-1">${c.groom?.full_name || 'Nama Pria'}</h4>
                        <p class="text-[9px] font-medium uppercase tracking-[0.2em] opacity-60 leading-loose mb-4">${c.groom?.desc || ''}</p>
                    </div>
                    <div class="reveal">
                        <h4 class="font-serif italic text-3xl mb-6">the Bride</h4>
                        <h4 class="font-serif italic text-3xl mb-1">${c.bride?.full_name || 'Nama Wanita'}</h4>
                        <p class="text-[9px] font-medium uppercase tracking-[0.2em] opacity-60 leading-loose mb-4">${c.bride?.desc || ''}</p>
                    </div>
                </section>
            `,
            'acara': (c) => `
                <section class="py-24 px-8 bg-neutral-50/50 text-center">
                    <div class="max-w-xl mx-auto space-y-16">
                        <h3 class="text-2xl font-serif italic mb-4">Wedding Events</h3>
                        ${c.ev1 ? `
                        <div class="reveal bg-white p-8 rounded-3xl shadow-sm border">
                            <p class="text-[11px] font-bold tracking-[0.3em] mb-3 uppercase text-gold">Akad Nikah</p>
                            <p class="text-lg font-serif mb-4">${c.ev1.time || ''}</p>
                            <p class="text-[11px] uppercase tracking-widest text-neutral-500 mb-8">${c.ev1.loc || ''}</p>
                            <a href="${c.ev1.maps || '#'}" target="_blank" class="inline-block px-10 py-4 border border-gold rounded-full text-[9px] uppercase tracking-widest font-bold text-gold">Petunjuk Lokasi</a>
                        </div>` : ''}
                        ${c.ev2 ? `
                        <div class="reveal bg-white p-8 rounded-3xl shadow-sm border">
                            <p class="text-[11px] font-bold tracking-[0.3em] mb-3 uppercase text-gold">Resepsi</p>
                            <p class="text-lg font-serif mb-4">${c.ev2.time || ''}</p>
                            <p class="text-[11px] uppercase tracking-widest text-neutral-500 mb-8">${c.ev2.loc || ''}</p>
                            <a href="${c.ev2.maps || '#'}" target="_blank" class="inline-block px-10 py-4 border border-gold rounded-full text-[9px] uppercase tracking-widest font-bold text-gold">Petunjuk Lokasi</a>
                        </div>` : ''}
                    </div>
                </section>
            `,
            'galeri': (c) => `
                <section class="py-24 px-4 text-center">
                    <h3 class="text-2xl font-serif italic mb-12">Our Moments</h3>
                    <div class="grid grid-cols-2 gap-2 max-w-lg mx-auto">
                        ${(c.gallery || []).map(src => `<img src="${src}" class="w-full aspect-square object-cover rounded-xl reveal">`).join('')}
                    </div>
                </section>
            `,
            'kado': (c) => `
                <section class="py-24 px-8 text-center bg-neutral-50/50">
                    <h3 class="text-2xl font-serif italic mb-12">Digital Gift</h3>
                    <div class="space-y-6">
                        ${(c.banking || []).map(acc => `
                            <div class="reveal max-w-sm mx-auto gift-card shadow-sm bg-white">
                                <p class="text-[10px] font-bold tracking-widest uppercase mb-2">BANK ${acc.type.toUpperCase()}</p>
                                <h4 class="text-2xl font-serif mb-1">${acc.rekening}</h4>
                                <p class="text-[11px] uppercase opacity-60 mb-6">A/N ${acc.owner}</p>
                                <button onclick="copyToClipboard('${acc.rekening}')" class="text-[9px] font-bold tracking-widest bg-neutral-900 text-white px-8 py-3 rounded-full uppercase">Salin Rekening</button>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `,
            'access_card': (c) => `
                <section class="py-24 px-8 bg-neutral-900 text-white text-center">
                    <div class="reveal max-w-sm mx-auto bg-white text-neutral-900 p-8 rounded-[40px]">
                        <p class="text-[10px] font-bold tracking-[0.3em] uppercase mb-8 opacity-40">Digital Access Card</p>
                        <div class="w-48 h-48 bg-stone-100 mx-auto mb-8 rounded-3xl flex items-center justify-center border-4 border-stone-50">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=SapaTamu" class="w-40 h-40 qrcode-img">
                        </div>
                        <h4 class="text-xl font-serif italic mb-2 guest-name-placeholder">Tamu Undangan</h4>
                        <p class="text-[9px] uppercase tracking-widest opacity-50">Tunjukkan QR Code ini kepada petugas penerima tamu</p>
                    </div>
                </section>
            `
        };

        function renderModularPage(config) {
            const canvas = document.getElementById('main-canvas');
            // Jika user tidak menentukan urutan, gunakan urutan default
            const sectionsOrder = config.sections_order || ['cover', 'mempelai', 'acara', 'galeri', 'access_card', 'kado'];
            
            let html = "";
            sectionsOrder.forEach(secKey => {
                if (SectionLibrary[secKey]) {
                    html += SectionLibrary[secKey](config);
                }
            });
            
            // Tambahkan Footer Global
            html += `<footer class="py-24 text-center bg-white"><p class="text-[8px] font-bold uppercase tracking-[0.8em] text-gold">SapaTamu.Ku</p></footer>`;
            
            canvas.innerHTML = html;
            
            // Update Guest Name di semua placeholder
            const urlParams = new URLSearchParams(window.location.search);
            const guestName = urlParams.get('to') || "Tamu Undangan";
            document.querySelectorAll('.guest-name-placeholder').forEach(el => el.innerText = guestName);
            
            // Update QR Code
            const clientId = getClientId();
            document.querySelectorAll('.qrcode-img').forEach(img => {
                img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(clientId + ' | ' + guestName)}`;
            });

            if (config.event_date) eventDate = new Date(config.event_date).getTime();
            if (config.music_url) audio.src = config.music_url;

            canvas.classList.remove('opacity-0');
            initObserver();
        }

        async function init() {
            const clientId = getClientId();
            if (!clientId) {
                document.getElementById('loader').classList.add('hidden');
                return;
            }

            try {
                const { data, error } = await _supabase
                    .from('invitations')
                    .select('*')
                    .ilike('client_id', clientId)
                    .maybeSingle();

                if (error) console.error("Supabase Error:", error);

                if (data) {
                    const savedThemeId = data.theme_id;
                    const urlParams = new URLSearchParams(window.location.search);
                    const requestedTheme = urlParams.get('theme');

                    if (savedThemeId === requestedTheme || !requestedTheme) {
                        let c = data.theme_config;
                        if (!c || Object.keys(c).length === 0) c = data.config;
                        
                        if (c && Object.keys(c).length > 0) {
                            const config = typeof c === 'string' ? JSON.parse(c) : c;
                            renderModularPage(config);
                        }
                    } else {
                        // Jika tidak ada data tersimpan untuk tema ini, render modular dengan data kosong (Starter Pack)
                        renderModularPage({});
                    }
                } else {
                    renderModularPage({});
                }
            } catch (err) { 
                console.error("Init error:", err); 
                renderModularPage({});
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert("Nomor rekening berhasil disalin!");
        }

        function startInvitation() {
            if (audio.src) {
                audio.play();
                isPlaying = true;
                updateMusicUI();
            }
            document.getElementById('cover').style.transform = 'translateY(-100%)';
            document.getElementById('content').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('content').style.opacity = '1';
                document.getElementById('music-btn').classList.remove('hidden');
                initObserver();
            }, 500);
        }

        function toggleMusic() {
            isPlaying ? audio.pause() : audio.play();
            isPlaying = !isPlaying;
            updateMusicUI();
        }

        function updateMusicUI() {
            const vis = document.getElementById('visualizer');
            isPlaying ? vis.classList.remove('paused') : vis.classList.add('paused');
            document.getElementById('music-txt').innerText = isPlaying ? "PAUSE" : "PLAY";
        }

        function updateCountdown() {
            if (!eventDate) return;
            const now = new Date().getTime();
            const gap = eventDate - now;
            if (gap > 0) {
                document.getElementById("days").innerText = Math.floor(gap / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                document.getElementById("hours").innerText = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById("mins").innerText = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                document.getElementById("secs").innerText = Math.floor((gap % (1000 * 60)) / 1000).toString().padStart(2, '0');
            }
        }

        function initObserver() {
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
        }

        setInterval(updateCountdown, 1000);
        // REAL-TIME SYNC FROM EDITOR
        window.addEventListener('message', (event) => {
            if (event.data.action === 'UPDATE_PREVIEW') {
                const c = event.data.config;
                if (!c) return;

                // Update Header & Hero
                if (c.title) document.getElementById('cv_header').innerText = c.title;
                if (c.pria_short || c.wanita_short) {
                    const names = `${c.pria_short || 'Pria'} & ${c.wanita_short || 'Wanita'}`;
                    document.getElementById('cv_names').innerText = names;
                    document.getElementById('hero_names').innerText = names;
                }
                if (c.hashtag) document.getElementById('hero_hashtag').innerText = c.hashtag;
                if (c.event_date) {
                    document.getElementById('hero_date').innerText = new Date(c.event_date).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    eventDate = new Date(c.event_date).getTime();
                }

                // Update Mempelai
                if (c.groom) {
                    document.getElementById('groom_name').innerText = c.groom.full_name || "Mempelai Pria";
                    document.getElementById('groom_desc').innerText = c.groom.desc || "";
                }
                if (c.bride) {
                    document.getElementById('bride_name').innerText = c.bride.full_name || "Mempelai Wanita";
                    document.getElementById('bride_desc').innerText = c.bride.desc || "";
                }

                // Update Acara
                if (c.ev1) {
                    document.getElementById('ev1_time').innerText = c.ev1.time || "-";
                    document.getElementById('ev1_loc').innerText = c.ev1.loc || "-";
                }
                if (c.ev2) {
                    document.getElementById('ev2_time').innerText = c.ev2.time || "-";
                    document.getElementById('ev2_loc').innerText = c.ev2.loc || "-";
                }

                // Render Banking (Real-time)
                const giftContainer = document.getElementById('gift-list');
                if (c.banking && c.banking.length > 0) {
                    document.getElementById('gift-section').classList.remove('hidden');
                    giftContainer.innerHTML = "";
                    c.banking.forEach(acc => {
                        const logo = BANK_LOGOS[acc.type.toLowerCase()] || "";
                        const div = document.createElement('div');
                        div.className = "max-w-sm mx-auto gift-card shadow-xl mb-6";
                        div.innerHTML = `
                            ${logo ? `<img src="${logo}" class="h-6 mx-auto mb-6 grayscale opacity-70">` : ""}
                            <p class="text-[10px] font-bold tracking-widest uppercase mb-2">BANK ${acc.type.toUpperCase()}</p>
                            <h4 class="text-2xl font-serif mb-1 tracking-wider">${acc.rekening}</h4>
                            <p class="text-[11px] uppercase tracking-widest opacity-60 mb-8">A/N ${acc.owner}</p>
                        `;
                        giftContainer.appendChild(div);
                    });
                }
            }
        });

        init();
    </script>
</body>
</html>
