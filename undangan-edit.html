<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Undangan - SapaTamu.Ku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; }
        .editor-container { height: calc(100vh - 64px); }
        .preview-frame {
            width: 375px;
            height: 667px;
            border: 12px solid #1e293b;
            border-radius: 40px;
            overflow: hidden;
            background: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .tab-active { border-left: 4px solid #E07B7B; background: #FFF1F1; color: #E07B7B; }
    </style>
</head>
<body class="overflow-hidden">

    <!-- NAVBAR -->
    <nav class="h-16 bg-white border-b flex items-center justify-between px-6">
        <div class="flex items-center gap-4">
            <a href="undangan.html" class="p-2 hover:bg-stone-100 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <h1 class="font-bold text-lg">Editor Undangan: <span id="theme-name" class="text-stone-400">Loading...</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="saveToSupabase(event)" class="bg-[#E07B7B] text-white px-6 py-2 rounded-xl font-bold text-sm shadow-lg shadow-rose-100 hover:bg-rose-500 transition">Simpan Perubahan</button>
        </div>
    </nav>

    <div class="flex editor-container">
        <!-- SIDEBAR NAV -->
        <aside class="w-64 bg-white border-r flex flex-col p-4 gap-2">
            <button class="flex items-center gap-3 p-3 rounded-xl font-semibold text-sm text-stone-500 tab-active">
                <span>💍</span> Informasi Dasar
            </button>
            <button class="flex items-center gap-3 p-3 rounded-xl font-semibold text-sm text-stone-500 hover:bg-stone-50">
                <span>👩‍❤️‍👨</span> Data Mempelai
            </button>
            <button class="flex items-center gap-3 p-3 rounded-xl font-semibold text-sm text-stone-500 hover:bg-stone-50">
                <span>📍</span> Detail Acara
            </button>
            <button class="flex items-center gap-3 p-3 rounded-xl font-semibold text-sm text-stone-500 hover:bg-stone-50">
                <span>🖼️</span> Galeri Foto
            </button>
            <button class="flex items-center gap-3 p-3 rounded-xl font-semibold text-sm text-stone-500 hover:bg-stone-50">
                <span>🎵</span> Musik & Fitur
            </button>
        </aside>

        <!-- FORM EDITOR -->
        <main class="flex-1 bg-white overflow-y-auto p-8 custom-scroll">
            <div class="max-w-xl mx-auto">
                <section id="section-basic">
                    <h2 class="text-2xl font-extrabold mb-6">Informasi Dasar</h2>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-stone-700 mb-2">Judul Undangan</label>
                            <input type="text" id="in_title" oninput="updatePreview()" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-2xl focus:ring-2 focus:ring-rose-200 outline-none transition" placeholder="The Wedding of...">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-stone-700 mb-2">Nama Panggilan Pria</label>
                                <input type="text" id="in_pria" oninput="updatePreview()" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-2xl focus:ring-2 focus:ring-rose-200 outline-none" placeholder="Gildan">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-stone-700 mb-2">Nama Panggilan Wanita</label>
                                <input type="text" id="in_wanita" oninput="updatePreview()" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-2xl focus:ring-2 focus:ring-rose-200 outline-none" placeholder="Mita">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-stone-700 mb-2">Background Musik (URL)</label>
                            <input type="text" id="in_music" class="w-full p-4 bg-stone-50 border border-stone-200 rounded-2xl focus:ring-2 focus:ring-rose-200 outline-none" placeholder="https://youtube.com/...">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-stone-700 mb-2">Foto Background Utama</label>
                            <div class="flex flex-col gap-3">
                                <input type="file" id="in_file" onchange="handleUpload(event)" class="hidden" accept="image/*">
                                <label for="in_file" class="cursor-pointer w-full p-8 border-2 border-dashed border-stone-200 rounded-[32px] flex flex-col items-center justify-center hover:border-rose-300 hover:bg-rose-50 transition group">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-stone-300 group-hover:text-rose-400 transition mb-2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                                    <span class="text-sm font-bold text-stone-500 group-hover:text-rose-600">Klik untuk Ganti Foto</span>
                                    <span class="text-[10px] text-stone-400 mt-1">Saran: Portrait (9:16), Max 2MB</span>
                                </label>
                                <p id="upload-status" class="text-center text-xs font-bold hidden"></p>
                            </div>
                        </div>

                        <div class="p-6 bg-rose-50 border border-rose-100 rounded-[32px]">
                            <h4 class="font-bold text-rose-800 mb-2 text-sm uppercase tracking-wider">Tips Design</h4>
                            <p class="text-rose-600 text-xs leading-relaxed">Gunakan foto dengan orientasi portrait agar terlihat pas di layar smartphone tamu Anda.</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <!-- LIVE PREVIEW AREA -->
        <aside class="flex-1 bg-slate-100 flex items-center justify-center p-8 border-l">
            <div class="preview-frame relative">
                <!-- SIMULATED MOBILE VIEW -->
                <div id="pv_bg" class="w-full h-full bg-stone-100 bg-cover bg-center transition-all duration-700 relative">
                    <div class="absolute inset-0 bg-black/30"></div>
                    <div id="preview-container" class="relative z-10 w-full h-full p-8 text-center flex flex-col items-center justify-center text-white">
                        <div id="pv_theme" class="text-[10px] text-rose-300 font-bold mb-4 tracking-widest uppercase">Rose Gold Theme</div>
                        <h1 id="pv_title" class="text-3xl font-serif mb-4 drop-shadow-lg">The Wedding of</h1>
                        <div class="flex items-center gap-4 mb-8">
                            <span id="pv_pria" class="text-4xl font-bold drop-shadow-md">Gildan</span>
                            <span class="text-rose-300 font-serif italic text-2xl">&</span>
                            <span id="pv_wanita" class="text-4xl font-bold drop-shadow-md">Mita</span>
                        </div>
                        <p class="text-white/80 text-sm italic drop-shadow-sm">Save the Date - 25.12.2026</p>
                        <div class="mt-12 w-24 h-1 bg-rose-300/50 mx-auto rounded-full"></div>
                    </div>
                </div>
                
                <!-- OVERLAY INDICATOR -->
                <div class="absolute bottom-6 left-1/2 -translate-x-1/2 bg-black/80 text-white text-[10px] px-3 py-1 rounded-full font-bold">LIVE PREVIEW</div>
            </div>
        </aside>
    </div>

    <script>
        // KONFIGURASI CLOUDINARY & SUPABASE
        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dvygmpmir/image/upload";
        const CLOUDINARY_PRESET = "sapatamu_preset";
        
        const SUPABASE_URL = "https://cikptujrzdfvyfihwamh.supabase.co";
        const SUPABASE_KEY = "sb_publishable_seQaFKafTwHg7fVTK0GHig_T0wT9Cj4KshA7hK6nY";
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentBgImage = "";

        // Helper untuk ambil cookie
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function getSessionData() {
            let data = localStorage.getItem('sapatamu_db');
            if (!data) {
                const cookieData = getCookie('sapatamu_session');
                if (cookieData) data = decodeURIComponent(cookieData);
            }
            return data ? JSON.parse(data) : null;
        }

        // FUNGSI UPLOAD KE CLOUDINARY
        async function handleUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusText = document.getElementById('upload-status');
            statusText.innerText = "⌛ Mengunggah...";
            statusText.classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_PRESET);

            try {
                const response = await fetch(CLOUDINARY_URL, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.secure_url) {
                    currentBgImage = data.secure_url;
                    document.getElementById('pv_bg').style.backgroundImage = `url('${currentBgImage}')`;
                    statusText.innerText = "✅ Berhasil Diunggah!";
                    statusText.classList.remove('text-red-500');
                    statusText.classList.add('text-green-500');
                }
            } catch (err) {
                console.error("Upload gagal:", err);
                statusText.innerText = "❌ Gagal mengunggah.";
                statusText.classList.remove('text-green-500');
                statusText.classList.add('text-red-500');
            }
        }

        // FUNGSI REAL-TIME PREVIEW
        function updatePreview() {
            const title = document.getElementById('in_title').value || "The Wedding of";
            const pria = document.getElementById('in_pria').value || "Gildan";
            const wanita = document.getElementById('in_wanita').value || "Mita";

            document.getElementById('pv_title').innerText = title;
            document.getElementById('pv_pria').innerText = pria;
            document.getElementById('pv_wanita').innerText = wanita;
        }

        // FUNGSI SIMPAN KE SUPABASE
        async function saveToSupabase(event) {
            const data = getSessionData();
            if (!data) return alert("Sesi habis, silakan login ulang.");
            const clientId = data.username;

            const configData = {
                title: document.getElementById('in_title').value,
                pria: document.getElementById('in_pria').value,
                wanita: document.getElementById('in_wanita').value,
                music: document.getElementById('in_music').value,
                bg_image: currentBgImage
            };

            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "💾 Menyimpan...";
            btn.disabled = true;

            try {
                const { error } = await _supabase
                    .from('invitations')
                    .update({ config: configData })
                    .eq('client_id', clientId);

                if (error) throw error;
                alert("Konfigurasi Berhasil Disimpan! 🎉");
            } catch (err) {
                alert("Gagal menyimpan: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // LOAD DATA AWAL JIKA ADA
        async function loadInitialData() {
            // Ambil Theme dari URL
            const urlParams = new URLSearchParams(window.location.search);
            const themeId = urlParams.get('theme') || 'rose-gold';
            document.getElementById('theme-name').innerText = themeId.toUpperCase();

            const data = getSessionData();
            if (!data) return;
            const clientId = data.username;

            const { data: invData, error } = await _supabase
                .from('invitations')
                .select('config')
                .eq('client_id', clientId)
                .single();

            if (invData && invData.config) {
                document.getElementById('in_title').value = invData.config.title || "";
                document.getElementById('in_pria').value = invData.config.pria || "";
                document.getElementById('in_wanita').value = invData.config.wanita || "";
                document.getElementById('in_music').value = invData.config.music || "";
                
                if (invData.config.bg_image) {
                    currentBgImage = invData.config.bg_image;
                    document.getElementById('pv_bg').style.backgroundImage = `url('${currentBgImage}')`;
                }
                updatePreview();
            }
        }

        document.addEventListener('DOMContentLoaded', loadInitialData);
    </script>
</body>
</html>
